# Local python http.server serves pages and JSON; /admin OAuth login works only on Vercel.
# Saving in the connected CMS commits directly to main and may deploy; do not use it for draft tests.
backend:
  name: github
  repo: radovik/team1
  branch: main
  base_url: https://team1-beige.vercel.app
  auth_endpoint: api/auth

site_url: https://team1-beige.vercel.app
display_url: https://team1-beige.vercel.app
logo_url: https://team1-beige.vercel.app/assets/silny-team-logo-01.svg

media_folder: img/uploads
public_folder: /img/uploads
locale: cs

collections:
  - name: pages
    label: Stránky
    files:
      - label: DOMŮ
        name: home
        file: content/pages/home.json
        format: json
        preview_path: "/"
        fields: &page_fields
          - label: Metadata
            name: meta
            widget: object
            collapsed: true
            fields:
              - { label: Titulek prohlížeče, name: title, widget: string }
              - { label: Popis stránky, name: description, widget: text, required: false }
          - label: Sekce stránky
            name: sections
            widget: list
            allow_add: false
            collapsed: true
            summary: "{{fields.label}}"
            fields:
              - { label: Název sekce, name: label, widget: string }
              - label: Texty a popisky
                name: items
                widget: list
                allow_add: false
                collapsed: true
                summary: "{{fields.label}}"
                fields:
                  - { label: Název pole, name: label, widget: string }
                  - { label: Technický selektor, name: selector, widget: hidden }
                  - { label: Režim zobrazení, name: mode, widget: hidden }
                  - { label: Atribut, name: attribute, widget: hidden, required: false }
                  - { label: Číslo nebo předpona, name: prefix, widget: string, required: false }
                  - { label: Text, name: value, widget: text, required: false, hint: "Text návrhu stránky. Úkoly upravujte v kolekci Poznámky k dokončení; návštěvnické stránky je nezobrazují. Prázdná profilová pole se nezobrazují." }
          - label: Obrázky
            name: images
            widget: list
            required: false
            allow_add: false
            collapsed: true
            summary: "{{fields.label}}"
            fields:
              - { label: Název obrázku, name: label, widget: string }
              - { label: Technický selektor, name: selector, widget: hidden }
              - { label: Soubor, name: src, widget: image, required: false }
              - { label: Alternativní text, name: alt, widget: string, hint: "Stručně popište, kdo je na fotografii. Nahrávejte jen schválené autentické fotografie." }
              - { label: Obrazový rám, name: container, widget: hidden, required: false }
              - { label: Šířka rámu, name: width, widget: hidden, required: false }
              - { label: Výška rámu, name: height, widget: hidden, required: false }
          - label: Profesní odkazy
            name: links
            widget: list
            required: false
            allow_add: false
            collapsed: true
            summary: "{{fields.label}}"
            fields:
              - { label: Popisek pole, name: label, widget: hidden }
              - { label: Umístění, name: selector, widget: hidden }
              - { label: Ověřená adresa, name: href, widget: string, required: false, hint: "Vložte jen ověřený profesní profil s https://. Prázdný odkaz se nezobrazuje." }
              - { label: Text odkazu, name: text, widget: string }
          - label: Časté otázky
            name: faq
            widget: object
            required: false
            collapsed: true
            fields:
              - { label: Technický selektor, name: selector, widget: hidden }
              - label: Otázky
                name: items
                widget: list
                summary: "{{fields.question}}"
                fields:
                  - { label: Otázka, name: question, widget: string }
                  - { label: Odpověď, name: answer, widget: text }
                  - { label: Otevřít při načtení, name: open, widget: boolean, default: false }
                  - { label: Připojená poznámka, name: note_id, widget: hidden, required: false }
          - label: Tabulky
            name: tables
            widget: list
            required: false
            allow_add: false
            collapsed: true
            summary: "{{fields.label}}"
            fields:
              - { label: Název tabulky, name: label, widget: string }
              - { label: Technický selektor, name: selector, widget: hidden }
              - label: Záhlaví
                name: headers
                widget: list
                field: { label: Buňka, name: header, widget: string }
              - label: Řádky
                name: rows
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { label: Název řádku, name: label, widget: string }
                  - label: Buňky
                    name: cells
                    widget: list
                    field: { label: Buňka, name: cell, widget: string }
      - label: S čím pomáháme
        name: s-cim-pomahame
        file: content/pages/s-cim-pomahame.json
        format: json
        preview_path: "/s-cim-pomahame/"
        fields: *page_fields
      - label: Jak pracujeme
        name: jak-pracujeme
        file: content/pages/jak-pracujeme.json
        format: json
        preview_path: "/jak-pracujeme/"
        fields: *page_fields
      - label: O nás
        name: o-nas
        file: content/pages/o-nas.json
        format: json
        preview_path: "/o-nas/"
        fields: *page_fields
      - label: Domluvit schůzku
        name: kontakt
        file: content/pages/kontakt.json
        format: json
        preview_path: "/kontakt/"
        fields: *page_fields
      - label: Ochrana soukromí
        name: soukromi
        file: content/pages/soukromi.json
        format: json
        preview_path: "/soukromi/"
        fields: *page_fields
      - label: Cookies
        name: cookies
        file: content/pages/cookies.json
        format: json
        preview_path: "/cookies/"
        fields: *page_fields
  - name: editorial
    label: Poznámky k dokončení
    files:
      - label: Společné poznámky
        name: editorial-notes
        file: content/editorial-notes.json
        format: json
        fields:
          - label: Poznámky
            name: notes
            widget: list
            allow_add: false
            collapsed: true
            summary: "{{fields.title}}"
            hint: "Úkoly zůstávají v administraci a na návštěvnických stránkách se nevykreslují. Soubor JSON je technicky veřejně dostupný, nejde o soukromé úložiště. Nevkládejte citlivé údaje. Uložení přes toto přihlášení zapisuje do main a může nasadit produkci; preview slouží jen k prohlížení."
            fields:
              - { label: Identifikátor, name: id, widget: hidden }
              - { label: Umístění v sekcích, name: section, widget: hidden }
              - { label: Název poznámky, name: title, widget: string }
              - { label: Co doplnit nebo ověřit, name: instruction, widget: text }
              - label: Stav kontroly
                name: status
                widget: select
                default: needs_input
                hint: "Stav eviduje dokončení úkolu v administraci. Poznámky se na návštěvnických stránkách nezobrazují bez ohledu na stav. Vyřešeno zvolte až po výslovném ověření; hotový obsah tím nezmizí."
                options:
                  - { label: K doplnění, value: needs_input }
                  - { label: Ke kontrole, value: ready_for_review }
                  - { label: Vyřešeno, value: resolved }
